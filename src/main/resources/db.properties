# ========================================================
# Konfigurasi Database Es Teh Solo
# ========================================================

# PostgreSQL Settings (Utama)
db.driver=org.postgresql.Driver
db.url=jdbc:postgresql://localhost:5432/esteh_db
db.user=postgres
db.password=postgres

# Mode Fallback Otomatis:
# Jika PostgreSQL lokal belum berjalan atau belum dibuat databasenya,
# sistem otomatis beralih ke mode embedded database agar aplikasi tetap dapat berjalan langsung tanpa error!
db.enableFallback=true
db.fallback.driver=org.h2.Driver
db.fallback.url=jdbc:h2:./esteh_database;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
db.fallback.user=sa
db.fallback.password=
